[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "skillforge"
version = "0.1.0"
description = "A model-agnostic, self-learning skill platform: portable SKILL.md packages with manifests, evals, permissions and provenance, executed on a managed LangGraph runtime, with human-gated dynamic skill creation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["langgraph>=0.2", "langchain-core", "pyyaml>=6"]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn", "strawberry-graphql[fastapi]>=0.220"]

[tool.setuptools.packages.find]
where = ["src"]
