apiVersion: skillforge/v1
name: frontend-design
version: 1.0.0
lifecycle: active
triggers:
  examples:
  - 'Design the settings page: layout, components and states'
  - Plan the UI for the new dashboard screen
  counter_examples:
  - Write the test plan for the settings page
  - Build the dashboard now
requires:
  tools: &id001
  - native:doc_search
  - native:file_writer
  capabilities:
  - tool_calling
  min_context_tokens: 8000
permissions:
  tools: *id001
  scripts: []
  network: none
  filesystem:
    read: []
    write:
    - ''
  approval_required_for: []
composition:
  composes: []
  conflicts: []
governs:
- write
output:
  sections:
  - Layout
  - Components
  - States
  - Accessibility
  - Open questions
budget:
  max_tokens_per_run: 30000
  max_script_seconds: null
evals:
  suite: evals/cases.yaml
  holdout: null
  min_pass: 0.9
