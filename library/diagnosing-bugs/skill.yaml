apiVersion: skillforge/v1
name: diagnosing-bugs
version: 1.0.0
lifecycle: active
triggers:
  examples:
  - Diagnose why checkout success dropped during the payments outage
  - "Something is wrong with session handling \u2014 find the root cause"
  counter_examples:
  - Write the stakeholder update about the outage
  - What is the refund policy for subscriptions?
requires:
  tools: &id001
  - native:doc_search
  - native:file_writer
  capabilities:
  - tool_calling
  min_context_tokens: 8000
permissions:
  tools: *id001
  scripts: []
  network: none
  filesystem:
    read: []
    write:
    - ''
  approval_required_for: []
composition:
  composes: []
  conflicts: []
governs:
- research
- write
output:
  sections:
  - Reproduction
  - Evidence
  - Hypothesis
  - Root cause
  - Fix
  - Regression check
budget:
  max_tokens_per_run: 30000
  max_script_seconds: null
evals:
  suite: evals/cases.yaml
  holdout: null
  min_pass: 0.9
