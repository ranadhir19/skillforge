apiVersion: skillforge/v1
name: verification-before-completion
version: 1.0.0
lifecycle: active
triggers:
  examples:
  - Verify the Q1 revenue numbers before we call this analysis done
  - Check that the totals in this report are actually right
  counter_examples:
  - Draft the Q1 revenue report
  - What is our refund policy?
requires:
  tools: &id001
  - native:data_lookup
  - native:calculator
  - native:file_writer
  capabilities:
  - tool_calling
  min_context_tokens: 8000
permissions:
  tools: *id001
  scripts: []
  network: none
  filesystem:
    read: []
    write:
    - ''
  approval_required_for: []
composition:
  composes: []
  conflicts: []
governs:
- compute
- write
output:
  sections:
  - Claim
  - Evidence
  - Verification
  - Discrepancies
budget:
  max_tokens_per_run: 30000
  max_script_seconds: null
evals:
  suite: evals/cases.yaml
  holdout: null
  min_pass: 0.9
