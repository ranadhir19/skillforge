apiVersion: skillforge/v1
name: spreadsheet-analysis
version: 1.0.0
lifecycle: active
triggers:
  examples:
  - Analyse this Q1 metrics spreadsheet and total the revenue column
  - Reconcile the spreadsheet totals against the metrics table
  counter_examples:
  - Write up the Q1 findings as a report
  - Extract the fields from this form
requires:
