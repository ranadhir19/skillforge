apiVersion: skillforge/v1
name: test-driven-development
version: 1.0.0
lifecycle: active
triggers:
  examples:
  - Fix the checkout totals rounding bug test-first
  - Implement the retry budget change with TDD
  counter_examples:
  - Explain the CI failure in run 8812
  - Review this diff for problems
requires:
  tools: &id001
  - native:doc_search
  - native:file_writer
  capabilities:
  - tool_calling
  min_context_tokens: 8000
permissions:
  tools: *id001
  scripts: []
  network: none
  filesystem:
    read: []
    write:
    - ''
  approval_required_for: []
composition:
  composes: []
  conflicts: []
governs:
- research
- write
output:
  sections:
  - Failing test
  - Expected behaviour
  - Minimal change
  - Green check
  - Refactor notes
budget:
  max_tokens_per_run: 30000
  max_script_seconds: null
evals:
  suite: evals/cases.yaml
  holdout: null
  min_pass: 0.9
